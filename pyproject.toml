[project]
name = "fastapi-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RainyNode", email = "1070187411@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[project.scripts]
fastapi-learning = "fastapi_learning:main"

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_learning"]


[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

